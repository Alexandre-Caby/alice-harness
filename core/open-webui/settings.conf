ENABLE_PERSISTENT_CONFIG=true
WEBUI_AUTH=true
ENABLE_SIGNUP=false
DEFAULT_USER_ROLE=user
ENABLE_CHANNELS=false
ENABLE_COMMUNITY_SHARING=false
USER_PERMISSIONS_FEATURES_AUTOMATIONS=true
USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=true
USER_PERMISSIONS_FEATURES_API_KEYS=false
USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=false

# Approval gate (endpoint and threshold: modules/decision/openwebui.conf)
ENABLE_TOOL_PERMISSIONS=true
ENABLE_TOOL_PERMISSIONS_AUTO=true
TOOL_PERMISSIONS_AUTO_ENGINE=decisions

# Code runs in the person's workspace, not in the browser (Pyodide)
ENABLE_CODE_INTERPRETER=false
ENABLE_CODE_EXECUTION=false

# Web search
ENABLE_WEB_SEARCH=true
WEB_SEARCH_ENGINE=duckduckgo
WEB_SEARCH_RESULT_COUNT=5
BYPASS_WEB_SEARCH_WEB_LOADER=false
ENABLE_LOCAL_WEB_FETCH=false

# Deep research runs as a background sub-agent; delegate_task is not allow-listed, so it asks first
ENABLE_SUBAGENTS=true
SUBAGENTS_BACKGROUND_ENABLED=true
SUBAGENTS_MAX_ASYNC=2

# Libraries
RAG_EMBEDDING_ENGINE=ollama
RAG_EMBEDDING_MODEL=bge-m3

# Telemetry
OFFLINE_MODE=true
HF_HUB_OFFLINE=1
ANONYMIZED_TELEMETRY=false
SCARF_NO_ANALYTICS=true
DO_NOT_TRACK=true
